name: CI

on:
  push:
    branches: [master]
    paths:
      - 'src/**/*.purs'
      - 'src/**/*.js'
      - 'test/**/*.purs'
      - 'test/**/*.js'
      - '*.json'
      - 'spago.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'src/**/*.purs'
      - 'src/**/*.js'
      - 'test/**/*.purs'
      - 'test/**/*.js'
      - '*.json'
      - 'spago.yaml'
      - '.github/workflows/ci.yml'
  repository_dispatch:

jobs:
  build:
    name: Build
    
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Set up a PureScript toolchain
        uses: purescript-contrib/setup-purescript@main
        with:
          purescript: "unstable"
          spago: "1.0.5"
          purs-tidy: "latest"

      - name: Cache PureScript dependencies
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-spago-${{ hashFiles('spago.yaml') }}
          path: |
            .spago
            output

      - name: Install dependencies
        run: spago fetch

      - name: Build source
        run: spago build --strict

      - name: Run tests
        run: spago test

      - name: Check formatting
        run: purs-tidy check src
